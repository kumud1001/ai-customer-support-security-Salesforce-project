
<template>

    <lightning-card title="AI Security Dashboard" icon-name="utility:shield">

        <!-- Loading -->
        <template if:true={isLoading}>
            <lightning-spinner
                alternative-text="Loading security alerts">
            </lightning-spinner>
        </template>

        <!-- ================================================= -->
        <!-- CREATE SECURITY ALERT -->
        <!-- ================================================= -->

        <div class="slds-box slds-m-around_medium">

            <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                Create Security Alert
            </h2>

            <div class="slds-grid slds-wrap slds-gutters">

                <!-- Incident Name -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">

                    <lightning-input
                        label="Incident Name"
                        value={incidentName}
                        onchange={handleIncidentName}>
                    </lightning-input>

                </div>

                <!-- Threat Type -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">

                    <lightning-input
                        label="Threat Type"
                        value={threatType}
                        placeholder="Example: Brute Force, DDoS, SQL Injection"
                        onchange={handleThreatType}>
                    </lightning-input>

                </div>

                <!-- Source IP -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">

                    <lightning-input
                        label="Source IP"
                        value={sourceIp}
                        placeholder="Example: 192.168.1.40"
                        onchange={handleSourceIp}>
                    </lightning-input>

                </div>

                <!-- Risk Score -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">

                    <lightning-input
                        type="number"
                        label="Risk Score"
                        min="0"
                        max="100"
                        value={riskScore}
                        onchange={handleRiskScore}>
                    </lightning-input>

                </div>

                <!-- Severity -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">

                    <lightning-combobox
                        label="Severity"
                        value={severity}
                        options={severityOptions}
                        onchange={handleSeverity}>
                    </lightning-combobox>

                </div>

                <!-- Attack Type -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">

                    <lightning-input
                        label="Attack Type"
                        value={attackType}
                        placeholder="Example: Network Attack"
                        onchange={handleAttackType}>
                    </lightning-input>

                </div>

                <!-- Description -->
                <div class="slds-col slds-size_1-of-1">

                    <lightning-textarea
                        label="Description"
                        value={description}
                        onchange={handleDescription}>
                    </lightning-textarea>

                </div>

                <!-- Recommendation -->
                <div class="slds-col slds-size_1-of-1">

                    <lightning-textarea
                        label="AI Recommendation"
                        value={recommendation}
                        onchange={handleRecommendation}>
                    </lightning-textarea>

                </div>

            </div>

            <div class="slds-m-top_medium">

                <lightning-button
                    label="Create Security Alert"
                    variant="brand"
                    onclick={handleCreateAlert}>
                </lightning-button>

            </div>

        </div>


        <!-- ================================================= -->
        <!-- SUMMARY CARDS -->
        <!-- ================================================= -->

        <div class="slds-grid slds-wrap slds-gutters slds-p-around_medium">

            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">

                <div class="slds-box slds-theme_shade">

                    <p class="slds-text-title">
                        Total Alerts
                    </p>

                    <p class="slds-text-heading_large">
                        {totalAlerts}
                    </p>

                </div>

            </div>


            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">

                <div class="slds-box slds-theme_shade">

                    <p class="slds-text-title">
                        Critical Alerts
                    </p>

                    <p class="slds-text-heading_large">
                        {criticalAlerts}
                    </p>

                </div>

            </div>


            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">

                <div class="slds-box slds-theme_shade">

                    <p class="slds-text-title">
                        High Risk
                    </p>

                    <p class="slds-text-heading_large">
                        {highRiskAlerts}
                    </p>

                </div>

            </div>

        </div>


        <!-- ================================================= -->
        <!-- FILTERS -->
        <!-- ================================================= -->

        <div class="slds-grid slds-wrap slds-gutters slds-p-around_medium">

            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">

                <lightning-combobox
                    label="Filter by Severity"
                    value={filterSeverity}
                    options={filterSeverityOptions}
                    onchange={handleFilterSeverity}>
                </lightning-combobox>

            </div>


            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">

                <lightning-combobox
                    label="Filter by Status"
                    value={filterStatus}
                    options={filterStatusOptions}
                    onchange={handleFilterStatus}>
                </lightning-combobox>

            </div>


            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">

                <lightning-combobox
                    label="Filter by Threat Type"
                    value={filterThreatType}
                    options={filterThreatTypeOptions}
                    onchange={handleFilterThreatType}>
                </lightning-combobox>

            </div>

        </div>


        <!-- FILTER BUTTONS -->

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">

            <lightning-button
                label="Clear Filters"
                onclick={handleClearFilters}>
            </lightning-button>

            <lightning-button
                class="slds-m-left_small"
                label="Refresh Alerts"
                icon-name="utility:refresh"
                onclick={handleRefresh}>
            </lightning-button>

        </div>


        <!-- ================================================= -->
        <!-- SECURITY ALERT TABLE -->
        <!-- ================================================= -->

        <div class="slds-p-around_medium">

            <lightning-datatable
                key-field="Id"
                data={filteredAlerts}
                columns={columns}
                hide-checkbox-column
                onrowaction={handleRowAction}>
            </lightning-datatable>

        </div>


        <!-- ================================================= -->
        <!-- ALERT DETAILS -->
        <!-- ================================================= -->

        <template if:true={showAlertDetails}>

            <div class="slds-box slds-m-around_medium">

                <div class="slds-grid slds-grid_align-spread">

                    <h2 class="slds-text-heading_medium">
                        Security Alert Details
                    </h2>

                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        title="Close"
                        onclick={handleCloseDetails}>
                    </lightning-button-icon>

                </div>


                <!-- Incident Name -->

                <div class="slds-m-top_medium">

                    <p>
                        <strong>Incident Name:</strong>
                        {selectedAlert.Name}
                    </p>

                </div>


                <!-- Threat Type -->

                <div class="slds-m-top_small">

                    <p>
                        <strong>Threat Type:</strong>
                        {selectedAlert.Threat_Type__c}
                    </p>

                </div>


                <!-- Severity -->

                <div class="slds-m-top_small">

                    <p>
                        <strong>Severity:</strong>
                        {selectedAlert.Severity__c}
                    </p>

                </div>


                <!-- Source IP -->

                <div class="slds-m-top_small">

                    <p>
                        <strong>Source IP:</strong>
                        {selectedAlert.Source_IP__c}
                    </p>

                </div>


                <!-- Risk Score -->

                <div class="slds-m-top_small">

                    <p>
                        <strong>Risk Score:</strong>
                        {selectedAlert.Risk_Score__c}
                    </p>

                </div>


                <!-- Status -->

                <div class="slds-m-top_small">

                    <p>
                        <strong>Status:</strong>
                        {selectedAlert.Status__c}
                    </p>

                </div>


                <!-- Description -->

                <div class="slds-m-top_small">

                    <p>
                        <strong>Description:</strong>
                    </p>

                    <p>
                        {selectedAlert.Description__c}
                    </p>

                </div>


                <!-- Existing Recommendation -->

                <div class="slds-m-top_small">

                    <p>
                        <strong>Existing AI Recommendation:</strong>
                    </p>

                    <p>
                        {selectedAlert.AI_Recommendation__c}
                    </p>

                </div>


                <!-- ================================================= -->
                <!-- AGENT BUTTON -->
                <!-- ================================================= -->

                <div class="slds-m-top_medium">

                    <lightning-button
                        label="Analyze with AI Agent"
                        variant="brand"
                        icon-name="utility:einstein"
                        onclick={handleAgentTriage}
                        disabled={agentLoading}>
                    </lightning-button>

                </div>


                <!-- ================================================= -->
                <!-- AGENT LOADING -->
                <!-- ================================================= -->

                <template if:true={agentLoading}>

                    <div class="slds-m-top_medium">

                        <lightning-spinner
                            alternative-text="AI Agent analyzing">
                        </lightning-spinner>

                        <p class="slds-m-top_small">
                            AI Agent is analyzing this security alert...
                        </p>

                    </div>

                </template>


                <!-- ================================================= -->
                <!-- AGENT RESULT -->
                <!-- ================================================= -->

                <template if:true={agentResult}>

                    <div class="slds-box slds-theme_shade slds-m-top_medium">

                        <h3 class="slds-text-heading_small slds-m-bottom_medium">
                            AI Agent Analysis
                        </h3>


                        <div class="slds-m-bottom_small">

                            <p>
                                <strong>Priority:</strong>
                                {agentResult.priority}
                            </p>

                        </div>


                        <div class="slds-m-bottom_small">

                            <p>
                                <strong>Classification:</strong>
                                {agentResult.classification}
                            </p>

                        </div>


                        <div class="slds-m-bottom_small">

                            <p>
                                <strong>Recommendation:</strong>
                                {agentResult.recommendation}
                            </p>

                        </div>


                        <div>

                            <p>
                                <strong>Next Action:</strong>
                                {agentResult.nextAction}
                            </p>

                        </div>

                    </div>

                </template>


                <!-- ================================================= -->
                <!-- AGENT ERROR -->
                <!-- ================================================= -->

                <template if:true={agentError}>

                    <div class="slds-text-color_error slds-m-top_medium">

                        {agentError}

                    </div>

                </template>

            </div>

        </template>


        <!-- ================================================= -->
        <!-- GENERAL ERROR -->
        <!-- ================================================= -->

        <template if:true={error}>

            <div class="slds-text-color_error slds-p-around_medium">

                Error loading security alerts.

            </div>

        </template>

    </lightning-card>

</template>
