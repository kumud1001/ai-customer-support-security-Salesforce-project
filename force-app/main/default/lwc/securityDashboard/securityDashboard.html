<template>
    <lightning-card
        title="AI Security Operations Dashboard"
        icon-name="utility:shield">

        <div class="slds-p-around_medium">

            <!-- ========================= -->
            <!-- Summary Cards -->
            <!-- ========================= -->
            <div class="summary-container">

                <div class="summary-card">
                    <div class="summary-title">Total Alerts</div>
                    <div class="summary-value">{totalAlerts}</div>
                </div>

                <div class="summary-card critical">
                    <div class="summary-title">Critical</div>
                    <div class="summary-value">{criticalAlerts}</div>
                </div>

                <div class="summary-card high">
                    <div class="summary-title">High Risk</div>
                    <div class="summary-value">{highRiskAlerts}</div>
                </div>

            </div>


            <!-- ========================= -->
            <!-- Create Security Alert -->
            <!-- ========================= -->
            <div class="slds-box slds-theme_default slds-m-top_medium">

                <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                    Create Security Alert
                </h2>

                <div class="slds-grid slds-wrap slds-gutters">

                    <!-- Incident Name -->
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                        <lightning-input
                            label="Incident Name"
                            value={incidentName}
                            onchange={handleIncidentName}
                            required>
                        </lightning-input>
                    </div>

                    <!-- Threat Type -->
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                        <lightning-input
                            label="Threat Type"
                            value={threatType}
                            onchange={handleThreatType}
                            placeholder="e.g. SQL Injection"
                            required>
                        </lightning-input>
                    </div>

                    <!-- Risk Score -->
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                        <lightning-input
                            type="number"
                            label="Risk Score"
                            value={riskScore}
                            onchange={handleRiskScore}
                            min="0"
                            max="100"
                            required>
                        </lightning-input>
                    </div>

                    <!-- Source IP -->
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                        <lightning-input
                            label="Source IP"
                            value={sourceIp}
                            onchange={handleSourceIp}
                            placeholder="e.g. 192.168.1.10"
                            required>
                        </lightning-input>
                    </div>

                    <!-- Severity -->
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                        <lightning-combobox
                            label="Severity"
                            value={severity}
                            options={severityOptions}
                            onchange={handleSeverity}
                            required>
                        </lightning-combobox>
                    </div>

                    <!-- Description -->
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                        <lightning-input
                            label="Description"
                            value={description}
                            onchange={handleDescription}
                            placeholder="Describe the security incident"
                            required>
                        </lightning-input>
                    </div>

                    <!-- AI Recommendation -->
                    <div class="slds-col slds-size_1-of-1 slds-p-bottom_small">
                        <lightning-textarea
                            label="AI Recommendation"
                            value={recommendation}
                            onchange={handleRecommendation}
                            placeholder="Recommended security action">
                        </lightning-textarea>
                    </div>

                </div>

                <!-- Create Button -->
                <div class="slds-m-top_medium">
                    <lightning-button
                        variant="brand"
                        label="Create Security Alert"
                        icon-name="utility:add"
                        onclick={handleCreateAlert}>
                    </lightning-button>
                </div>

            </div>


            <!-- ========================= -->
            <!-- Refresh -->
            <!-- ========================= -->
            <div class="slds-m-top_medium slds-m-bottom_medium">

                <lightning-button
                    label="Refresh Alerts"
                    icon-name="utility:refresh"
                    onclick={handleRefresh}>
                </lightning-button>

            </div>


            <!-- ========================= -->
            <!-- Loading -->
            <!-- ========================= -->
            <template if:true={isLoading}>

                <lightning-spinner
                    alternative-text="Loading security alerts">
                </lightning-spinner>

            </template>


            <!-- ========================= -->
            <!-- Error -->
            <!-- ========================= -->
            <template if:true={error}>

                <div class="slds-notify slds-notify_alert slds-theme_error">
                    Unable to load security alerts.
                </div>

            </template>


            <!-- ========================= -->
            <!-- Security Alerts -->
            <!-- ========================= -->
            <template if:false={isLoading}>

                <div class="slds-m-top_medium">

                    <h2 class="slds-text-heading_medium slds-m-bottom_small">
                        Security Alerts
                    </h2>


                    <!-- Severity Filter -->
                    <div class="slds-m-bottom_medium">

                        <lightning-combobox
                            label="Filter by Severity"
                            value={filterSeverity}
                            options={filterSeverityOptions}
                            onchange={handleFilterSeverity}>
                        </lightning-combobox>

                    </div>


                    <!-- Status Filter -->
                    <div class="slds-m-bottom_medium">

                        <lightning-combobox
                            label="Filter by Status"
                            value={filterStatus}
                            options={filterStatusOptions}
                            onchange={handleFilterStatus}>
                        </lightning-combobox>

                    </div>


                    <!-- Threat Type Filter -->
                    <div class="slds-m-bottom_medium">

                        <lightning-combobox
                            label="Filter by Threat Type"
                            value={filterThreatType}
                            options={filterThreatTypeOptions}
                            onchange={handleFilterThreatType}>
                        </lightning-combobox>

                    </div>


                    <!-- Clear Filters -->
                    <div class="slds-m-bottom_medium">

                        <lightning-button
                            label="Clear Filters"
                            icon-name="utility:clear"
                            onclick={handleClearFilters}>
                        </lightning-button>

                    </div>


                    <!-- Alert Table -->
                    <lightning-datatable
                        key-field="Id"
                        data={filteredAlerts}
                        columns={columns}
                        hide-checkbox-column
                        onrowaction={handleRowAction}>
                    </lightning-datatable>


                    <!-- ========================= -->
                    <!-- Alert Details -->
                    <!-- ========================= -->
                    <template if:true={showAlertDetails}>

                        <div class="slds-box slds-m-top_medium">

                            <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                                Security Alert Details
                            </h2>

                            <p class="slds-m-bottom_small">
                                <strong>Threat Type:</strong>
                                {selectedAlert.Threat_Type__c}
                            </p>

                            <p class="slds-m-bottom_small">
                                <strong>Severity:</strong>
                                {selectedAlert.Severity__c}
                            </p>

                            <p class="slds-m-bottom_small">
                                <strong>Source IP:</strong>
                                {selectedAlert.Source_IP__c}
                            </p>

                            <p class="slds-m-bottom_small">
                                <strong>Risk Score:</strong>
                                {selectedAlert.Risk_Score__c}
                            </p>

                            <p class="slds-m-bottom_small">
                                <strong>Status:</strong>
                                {selectedAlert.Status__c}
                            </p>

                            <p class="slds-m-bottom_small">
                                <strong>Description:</strong>
                                {selectedAlert.Description__c}
                            </p>

                            <p class="slds-m-bottom_small">
                                <strong>AI Recommendation:</strong>
                                {selectedAlert.AI_Recommendation__c}
                            </p>

                            <p class="slds-m-bottom_small">
                                <strong>Detected At:</strong>
                                {selectedAlert.Detected_At__c}
                            </p>


                            <!-- Close Details -->
                            <div class="slds-m-top_medium">

                                <lightning-button
                                    label="Close Details"
                                    onclick={handleCloseDetails}>
                                </lightning-button>

                            </div>

                        </div>

                    </template>

                </div>

            </template>

        </div>

    </lightning-card>
</template>
